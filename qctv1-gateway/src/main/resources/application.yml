server:
  port: 10080

spring:
  application:
    name: qctv1-gateway
  main:
    web-application-type: reactive
  data:
    redis:
      host: ${QCTV1_REDIS_HOST:localhost}
      port: ${QCTV1_REDIS_PORT:6379}
      password: ${QCTV1_REDIS_PASSWORD:}
      database: ${QCTV1_REDIS_DATABASE:0}
  profiles:
    # 默认走 nacos 模式，便于本地和联调环境统一使用注册发现。
    # 如需本机直连调试，可显式切回 local profile。
    default: nacos
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 10000
            response-timeout: 180s
          discovery:
            locator:
              enabled: false

management:
  endpoint:
    gateway:
      access: read-only
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway

resilience4j:
  circuitbreaker:
    instances:
      chat-api:
        sliding-window-size: 20
        failure-rate-threshold: 50
      image-api:
        sliding-window-size: 20
        failure-rate-threshold: 50
      hello-api:
        sliding-window-size: 20
        failure-rate-threshold: 50
      agent-api:
        sliding-window-size: 20
        failure-rate-threshold: 50
      code-api:
        sliding-window-size: 20
        failure-rate-threshold: 50

qctv1:
  gateway:
    routes:
      # 默认按服务名走 Nacos 注册发现。
      # local 模式会在 application-local.yml 中覆盖成固定 HTTP 地址。
      chat-uri: lb://qctv1-ai-chat
      rag-uri: lb://qctv1-ai-rag
      iam-uri: lb://qctv1-iam
      connect-timeout-ms: 10000
      response-timeout-ms: 180000
      retry-enabled: true
      retry-count: 2
      circuit-breaker-enabled: true
    auth:
      enabled: true
      jwt-secret: ${QCTV1_JWT_SECRET:Qctv1JwtSecretKeyForDevOnlyPleaseChange1234567890}
      issuer: qctv1-iam
      whitelist:
        - /actuator/**
        - /api/iam/auth/login
        - /api/iam/auth/register
        - /api/iam/auth/refresh
        - /api/ai/chat/stream
        - /api/ai/agent/chat
    cors:
      allowed-origin-patterns:
        - http://localhost:*
        - http://127.0.0.1:*
        - https://localhost:*
        - https://127.0.0.1:*
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      exposed-headers:
        - X-Request-Id
