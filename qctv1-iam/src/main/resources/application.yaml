server:
  port: 10083
  servlet:
    encoding:
      enabled: true
      force: true
      charset: UTF-8

spring:
  application:
    name: qctv1-iam
  profiles:
    default: nacos
  datasource:
    url: jdbc:mysql://${QCTV1_DB_MYSQL_HOST:localhost}:${QCTV1_DB_MYSQL_PORT:3306}/qctv1-dev?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: ${QCTV1_DB_MYSQL_USER:root}
    password: ${QCTV1_DB_MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${QCTV1_REDIS_HOST:localhost}
      port: ${QCTV1_REDIS_PORT:6379}
      password: ${QCTV1_REDIS_PASSWORD:}
      database: ${QCTV1_REDIS_DATABASE:0}

management:
  endpoints:
    web:
      exposure:
        include: health,info

mybatis-plus:
  global-config:
    db-config:
      id-type: ASSIGN_ID
  configuration:
    map-underscore-to-camel-case: true

qctv1:
  iam:
    jwt:
      issuer: qctv1-iam
      secret: ${QCTV1_JWT_SECRET:Qctv1JwtSecretKeyForDevOnlyPleaseChange1234567890}
      access-expire-minutes: 30
      refresh-expire-days: 7
